<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>멍냥 탐정 - 견종 & 행동 퀴즈</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B3A4A">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="멍냥탐정">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF2FF;
    --sky2:#DCE9FF;
    --grass:#8FB996;
    --grass-dark:#78A480;
    --amber:#FFB84D;
    --ink:#2B3A4A;
    --ink-soft:#5C6B7A;
    --card:#FFFFFF;
    --good:#4CAF6D;
    --bad:#E8615B;
    --shadow: 0 10px 30px rgba(43,58,74,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Noto Sans KR', sans-serif;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky2) 55%, var(--grass) 55%, var(--grass-dark) 100%);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding: 24px 14px 40px;
    position:relative;
    overflow-x:hidden;
  }
  .sun{
    position:absolute; top:26px; right:8%;
    width:64px; height:64px; border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 0 10px rgba(255,184,77,0.18);
  }
  .wrap{ width:100%; max-width:480px; position:relative; z-index:1; }
  .title{
    text-align:center;
    font-family:'Gowun Dodum', sans-serif;
    font-size:28px;
    margin: 4px 0 2px;
    letter-spacing:-0.5px;
  }
  .subtitle{ text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:18px; }
  .hud{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border-radius:16px; padding:10px 16px;
    box-shadow:var(--shadow); margin-bottom:16px; font-size:13px; font-weight:600;
  }
  .paws{ display:flex; gap:4px; }
  .paw{ width:16px; height:16px; opacity:0.25; }
  .paw.on{ opacity:1; }
  .card{ background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:22px 18px 18px; }
  .prompt-label{ font-size:12px; color:var(--ink-soft); text-align:center; margin-bottom:6px; font-weight:600; }
  .prompt-name{
    text-align:center; font-family:'Gowun Dodum', sans-serif; font-size:30px; color:var(--ink);
    background: linear-gradient(180deg, #fff, #F6F9FF);
    border:2px dashed #C9D8EE; border-radius:16px; padding:14px 10px; margin-bottom:18px;
  }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .choice{
    background:#F7F9FC; border:2px solid #E5EAF2; border-radius:16px; padding:8px 6px 10px;
    cursor:pointer; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; text-align:center;
  }
  .choice:hover{ transform: translateY(-3px); box-shadow: 0 8px 16px rgba(43,58,74,0.10); }
  .choice:active{ transform: translateY(0px) scale(0.98); }
  .choice svg{ width:100%; height:auto; display:block; }
  .choice.correct{ border-color: var(--good); background: #EAF8EE; animation: pop .35s ease; }
  .choice.wrong{ border-color: var(--bad); background: #FDECEC; animation: shake .35s ease; }
  .choice.disabled{ pointer-events:none; opacity:0.55; }
  .choice.disabled.correct, .choice.disabled.wrong{ opacity:1; }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.06);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .behavior-scene{
    background: linear-gradient(180deg, #F7FAFF, #EFF4FC);
    border:2px dashed #C9D8EE; border-radius:16px; padding:8px 10px 4px; margin-bottom:14px;
  }
  .behavior-scene svg{ width:100%; height:auto; display:block; }
  .behavior-caption{
    text-align:center; font-size:14.5px; font-weight:700; color:var(--ink);
    padding: 8px 4px 12px; line-height:1.5;
  }
  .choice-list{ display:flex; flex-direction:column; gap:10px; }
  .choice-text{
    background:#F7F9FC; border:2px solid #E5EAF2; border-radius:14px; padding:13px 14px;
    cursor:pointer; text-align:left; font-size:13.5px; line-height:1.5; font-weight:600;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .choice-text:hover{ transform: translateY(-2px); box-shadow: 0 8px 16px rgba(43,58,74,0.08); }
  .choice-text.correct{ border-color: var(--good); background: #EAF8EE; animation: pop .35s ease; }
  .choice-text.wrong{ border-color: var(--bad); background: #FDECEC; animation: shake .35s ease; }
  .choice-text.disabled{ pointer-events:none; opacity:0.6; }
  .choice-text.disabled.correct, .choice-text.disabled.wrong{ opacity:1; }

  .feedback{ min-height: 26px; text-align:center; font-weight:600; font-size:14px; margin-top:14px; }
  .feedback.good{ color:var(--good); }
  .feedback.bad{ color:var(--bad); }

  .next-btn{
    display:block; margin: 12px auto 0; padding: 10px 26px; border:none; border-radius: 999px;
    background: var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer;
    opacity:0; pointer-events:none; transition: opacity .2s ease;
  }
  .next-btn.show{ opacity:1; pointer-events:auto; }
  .next-btn:hover{ background:#1c2733; }

  .end-card{ text-align:center; padding: 30px 20px; }
  .end-badge{ font-family:'Gowun Dodum', sans-serif; font-size:22px; margin: 6px 0 2px; }
  .end-score{ font-size:44px; font-weight:800; margin: 8px 0 4px; }
  .end-desc{ color:var(--ink-soft); font-size:13px; margin-bottom: 20px; }
  .restart-btn{
    padding: 12px 30px; border:none; border-radius:999px; background: var(--amber); color:#3A2A0F;
    font-weight:800; font-size:15px; cursor:pointer; box-shadow: 0 8px 18px rgba(255,184,77,0.4); margin: 0 6px;
  }
  .restart-btn.secondary{ background:#fff; color:var(--ink); box-shadow:var(--shadow); border:2px solid #E5EAF2; }
  .restart-btn:hover{ filter:brightness(1.03); }

  .start-card{ text-align:center; padding: 26px 18px 20px; }
  .start-dogs{ display:flex; justify-content:center; margin-bottom: 10px; }
  .start-dogs svg{ width:72px; margin: 0 -8px; }
  .start-desc{ color:var(--ink-soft); font-size:13.5px; line-height:1.6; margin: 10px 0 18px; }

  .mode-select{ display:flex; gap:10px; margin-bottom:6px; }
  .mode-btn{
    flex:1; padding:16px 8px; border-radius:16px; border:2px solid #E5EAF2; background:#F7F9FC;
    cursor:pointer; font-weight:700; font-size:13.5px; text-align:center; transition:.15s;
  }
  .mode-btn:hover{ border-color:#C9D8EE; }
  .mode-emoji{ font-size:26px; display:block; margin-bottom:6px; }
  .mode-sub{ display:block; font-weight:400; font-size:11px; color:var(--ink-soft); margin-top:3px; }

  .start-btn{
    padding: 13px 34px; border:none; border-radius:999px; background: var(--ink); color:#fff;
    font-weight:800; font-size:15px; cursor:pointer;
  }
  .start-btn:hover{ background:#1c2733; }
  .footer-note{ text-align:center; font-size:11px; color:var(--ink-soft); opacity:0.7; margin-top:14px; }
</style>
</head>
<body>
<div class="sun"></div>
<div class="wrap">
  <div class="title">🐾 멍냥 탐정</div>
  <div class="subtitle">견종도 맞히고, 마음도 읽어봐요</div>
  <div id="app"></div>
</div>

<script>
/* =========================================================

========================================================= */
const D = { fur:'#E3A868', shade:'#C98B4E', snout:'#FBEBD3', tongue:'#F2879C', ink:'#3A2A15' };

/* =========================================================
   모드 1: 견종 맞추기 데이터
========================================================= */
const DOGS = [
  { key:'jindo', name:'진돗개', fur:'#F3E4C6', furShade:'#E7D2A8', snout:'#FFF7EA', ear:'pointy', pattern:null, eye:'#3A2C1E', collar:'#E85B4A', scale:1.0 },
  { key:'shiba', name:'시바견', fur:'#E58C43', furShade:'#C96F2C', snout:'#FBEBD3', ear:'pointy', pattern:'mask', patternColor:'#FBEBD3', eye:'#3A2415', collar:'#2E4374', scale:0.98 },
  { key:'corgi', name:'웰시코기', fur:'#E3AC69', furShade:'#CB8F49', snout:'#FFF7EA', ear:'pointy-big', pattern:'blaze', patternColor:'#FFF7EA', eye:'#3A2415', collar:'#4E8F5C', scale:0.92 },
  { key:'golden', name:'골든리트리버', fur:'#F1CB7B', furShade:'#DDAE4E', snout:'#FBE9C4', ear:'floppy', pattern:null, eye:'#4A3315', collar:'#8A3B4F', scale:1.05 },
  { key:'poodle', name:'푸들', fur:'#F4E0B4', furShade:'#E3C888', snout:'#FBF0D8', ear:'floppy-curl', pattern:'curly', patternColor:'#E9CE99', eye:'#3A2415', collar:'#E58AB0', scale:1.0 },
  { key:'dachshund', name:'닥스훈트', fur:'#6E4626', furShade:'#552F17', snout:'#8A5A34', pattern:'tanpoints', patternColor:'#C98B4E', ear:'floppy-long', eye:'#20140A', collar:'#D9A441', scale:0.95, longSnout:true },
  { key:'bulldog', name:'불도그', fur:'#DDAE78', furShade:'#C4915B', snout:'#3B2A22', pattern:'wrinkles', patternColor:'#B98A54', ear:'rose', eye:'#20140A', collar:'#3B8E88', scale:1.05, wideSnout:true },
  { key:'chihuahua', name:'치와와', fur:'#E7BD86', furShade:'#D3A164', snout:'#F6E3C2', ear:'bat', pattern:null, eye:'#20140A', collar:'#8B5FBF', scale:0.82, bigEyes:true },
  { key:'husky', name:'시베리안허스키', fur:'#8FA0AA', furShade:'#6D8089', snout:'#F3F5F6', ear:'pointy', pattern:'mask', patternColor:'#F3F5F6', eye:'#7FC4E0', collar:'#C24B3D', scale:1.02 },
  { key:'dalmatian', name:'달마시안', fur:'#FBFBFA', furShade:'#E9E9E6', snout:'#FFFFFF', ear:'floppy-black', pattern:'spots', patternColor:'#2B2B2B', eye:'#20140A', collar:'#F0C33C', scale:1.0 },
  { key:'beagle', name:'비글', fur:'#F2EDE3', furShade:'#DFD8C8', snout:'#FFFFFF', ear:'floppy-brown', pattern:'tricolor', patternColor:'#B5763A', patternColor2:'#2B2320', eye:'#3A2415', collar:'#E07A2E', scale:0.95 },
  { key:'pomeranian', name:'포메라니안', fur:'#F0A253', furShade:'#D8853A', snout:'#FBE3C2', ear:'pointy-small', pattern:'fluffy', patternColor:'#F6B979', eye:'#20140A', collar:'#3B9E93', scale:0.9, bigEyes:true },
  { key:'greatdane', name:'그레이트데인', fur:'#7C8791', furShade:'#636D77', snout:'#DDE1E5', ear:'floppy-crop', pattern:null, eye:'#20140A', collar:'#2E3F63', scale:1.18 },
  { key:'schnauzer', name:'슈나우저', fur:'#A7A29A', furShade:'#8B8680', snout:'#C9C4BC', ear:'cropped', pattern:'beard', patternColor:'#EDEAE3', eye:'#20140A', collar:'#6B4A2F', scale:1.0 },
  { key:'bordercollie', name:'보더콜리', fur:'#2E2E2E', furShade:'#1C1C1C', snout:'#F5F0E6', ear:'pointy-small', pattern:'blaze', patternColor:'#F5F0E6', eye:'#1A1A1A', collar:'#C0392B', scale:1.0 },
  { key:'rottweiler', name:'로트와일러', fur:'#2B2320', furShade:'#1A140F', snout:'#3B2A22', ear:'floppy', pattern:'tanpoints', patternColor:'#B5763A', eye:'#1A1008', collar:'#7A1F1F', scale:1.08 },
  { key:'bichon', name:'비숑프리제', fur:'#FBF8F1', furShade:'#EDE6D6', snout:'#FFFFFF', ear:'floppy-curl', pattern:'curly', patternColor:'#F1EAD9', eye:'#2B2320', collar:'#8EC6E6', scale:0.85 },
  { key:'papillon', name:'파피용', fur:'#FBF3E6', furShade:'#E3B98A', snout:'#FFF8ED', ear:'bat', pattern:null, eye:'#2B2320', collar:'#B497D6', scale:0.78, bigEyes:true },
  { key:'samoyed', name:'사모예드', fur:'#FBFAF6', furShade:'#EDEAE0', snout:'#FFFFFF', ear:'pointy', pattern:'fluffy', patternColor:'#F1EEE3', eye:'#2B2320', collar:'#3FAFA0', scale:1.05 },
  { key:'doberman', name:'도베르만', fur:'#231C18', furShade:'#150F0C', snout:'#2B2320', ear:'cropped', pattern:'tanpoints', patternColor:'#8B5A2B', eye:'#150F0C', collar:'#111111', scale:1.05 },
  { key:'pug', name:'퍼그', fur:'#DDBB85', furShade:'#C49F63', snout:'#2B231D', ear:'rose', pattern:'wrinkles', patternColor:'#B99A63', eye:'#150F0C', collar:'#C99A3B', scale:0.85, wideSnout:true },
  { key:'maltese', name:'말티즈', fur:'#FCFBF7', furShade:'#EEEAE0', snout:'#FFFFFF', ear:'floppy-long', pattern:null, eye:'#2B2320', collar:'#E58AB0', scale:0.8, bigEyes:true },
  { key:'yorkie', name:'요크셔테리어', fur:'#6E7A8A', furShade:'#4E5866', snout:'#EFD9B0', ear:'pointy-small', pattern:'tanpoints', patternColor:'#C99A5A', eye:'#150F0C', collar:'#C0392B', scale:0.78 },
  { key:'bostonterrier', name:'보스턴테리어', fur:'#211D1B', furShade:'#141110', snout:'#2B2320', ear:'bat', pattern:'mask', patternColor:'#FBF8F1', eye:'#0E0B09', collar:'#2E4374', scale:0.9 },
];

function ears(cfg){
  const shapes = {
    'pointy': `<path d="M62,78 L38,20 L82,68 Z" fill="${cfg.fur}"/><path d="M138,78 L162,20 L118,68 Z" fill="${cfg.fur}"/>`,
    'pointy-big': `<path d="M60,80 L28,18 L84,66 Z" fill="${cfg.fur}"/><path d="M140,80 L172,18 L116,66 Z" fill="${cfg.fur}"/>`,
    'pointy-small': `<path d="M68,80 L54,35 L86,72 Z" fill="${cfg.fur}"/><path d="M132,80 L146,35 L114,72 Z" fill="${cfg.fur}"/>`,
    'floppy': `<path d="M58,85 C28,95 22,150 48,168 C60,150 62,105 58,85 Z" fill="${cfg.furShade}"/><path d="M142,85 C172,95 178,150 152,168 C140,150 138,105 142,85 Z" fill="${cfg.furShade}"/>`,
    'floppy-curl': `<path d="M56,88 C22,96 16,150 44,172 C60,158 60,108 56,88 Z" fill="${cfg.patternColor}"/><path d="M144,88 C178,96 184,150 156,172 C140,158 140,108 144,88 Z" fill="${cfg.patternColor}"/>`,
    'floppy-long': `<path d="M56,90 C20,100 14,158 42,182 C58,164 60,112 56,90 Z" fill="${cfg.furShade}"/><path d="M144,90 C180,100 186,158 158,182 C142,164 140,112 144,90 Z" fill="${cfg.furShade}"/>`,
    'floppy-black': `<path d="M58,85 C28,95 22,150 48,168 C60,150 62,105 58,85 Z" fill="#2B2B2B"/><path d="M142,85 C172,95 178,150 152,168 C140,150 138,105 142,85 Z" fill="#2B2B2B"/>`,
    'floppy-brown': `<path d="M58,85 C28,95 22,150 48,168 C60,150 62,105 58,85 Z" fill="${cfg.patternColor}"/><path d="M142,85 C172,95 178,150 152,168 C140,150 138,105 142,85 Z" fill="${cfg.patternColor}"/>`,
    'floppy-crop': `<path d="M62,86 C42,94 40,130 54,148 C64,134 64,102 62,86 Z" fill="${cfg.furShade}"/><path d="M138,86 C158,94 160,130 146,148 C136,134 136,102 138,86 Z" fill="${cfg.furShade}"/>`,
    'bat': `<path d="M64,82 L46,24 L86,70 Z" fill="${cfg.fur}"/><path d="M136,82 L154,24 L114,70 Z" fill="${cfg.fur}"/><path d="M64,82 L52,32 L82,70 Z" fill="#F6E3C2"/><path d="M136,82 L148,32 L118,70 Z" fill="#F6E3C2"/>`,
    'rose': `<path d="M66,88 C54,90 50,104 60,112 C70,110 72,94 66,88 Z" fill="${cfg.furShade}"/><path d="M134,88 C146,90 150,104 140,112 C130,110 128,94 134,88 Z" fill="${cfg.furShade}"/>`,
    'cropped': `<path d="M66,80 L58,42 L82,72 Z" fill="${cfg.furShade}"/><path d="M134,80 L142,42 L118,72 Z" fill="${cfg.furShade}"/>`,
  };
  return shapes[cfg.ear] || shapes['pointy'];
}

function pattern(cfg){
  if(!cfg.pattern) return '';
  const p = cfg.pattern;
  if(p==='mask') return `<path d="M70,108 C80,96 120,96 130,108 C126,128 128,142 100,148 C72,142 74,128 70,108 Z" fill="${cfg.patternColor}"/>`;
  if(p==='blaze') return `<path d="M90,120 C95,140 105,140 110,120 L106,160 L94,160 Z" fill="${cfg.patternColor}"/>`;
  if(p==='tanpoints') return `<circle cx="76" cy="112" r="7" fill="${cfg.patternColor}"/><circle cx="124" cy="112" r="7" fill="${cfg.patternColor}"/><ellipse cx="100" cy="150" rx="22" ry="10" fill="${cfg.patternColor}"/>`;
  if(p==='wrinkles') return `<path d="M78,92 Q100,84 122,92" stroke="${cfg.patternColor}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M74,102 Q100,94 126,102" stroke="${cfg.patternColor}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  if(p==='spots') return `<circle cx="72" cy="92" r="7" fill="${cfg.patternColor}"/><circle cx="128" cy="98" r="9" fill="${cfg.patternColor}"/><circle cx="106" cy="80" r="6" fill="${cfg.patternColor}"/><circle cx="86" cy="140" r="6" fill="${cfg.patternColor}"/><circle cx="122" cy="135" r="5" fill="${cfg.patternColor}"/>`;
  if(p==='tricolor') return `<path d="M70,90 C82,78 100,80 104,96 C96,110 76,108 70,90 Z" fill="${cfg.patternColor}"/><path d="M70,150 C90,168 110,168 130,150 L130,132 C110,142 90,142 70,132 Z" fill="${cfg.patternColor2}"/>`;
  if(p==='fluffy') return `<circle cx="56" cy="120" r="10" fill="${cfg.patternColor}"/><circle cx="144" cy="120" r="10" fill="${cfg.patternColor}"/><circle cx="60" cy="145" r="9" fill="${cfg.patternColor}"/><circle cx="140" cy="145" r="9" fill="${cfg.patternColor}"/>`;
  if(p==='curly') return `<circle cx="60" cy="72" r="9" fill="${cfg.patternColor}"/><circle cx="78" cy="58" r="9" fill="${cfg.patternColor}"/><circle cx="100" cy="52" r="9" fill="${cfg.patternColor}"/><circle cx="122" cy="58" r="9" fill="${cfg.patternColor}"/><circle cx="140" cy="72" r="9" fill="${cfg.patternColor}"/>`;
  if(p==='beard') return `<path d="M72,130 C72,158 128,158 128,130 C120,150 80,150 72,130 Z" fill="${cfg.patternColor}"/><ellipse cx="78" cy="96" rx="10" ry="5" fill="${cfg.patternColor}" transform="rotate(-10 78 96)"/><ellipse cx="122" cy="96" rx="10" ry="5" fill="${cfg.patternColor}" transform="rotate(10 122 96)"/>`;
  return '';
}

function dogSVG(cfg){
  const eyeR = cfg.bigEyes ? 8 : 5.5;
  const eyeY = 108;
  const snoutRx = cfg.wideSnout ? 34 : (cfg.longSnout ? 22 : 26);
  const snoutRy = cfg.wideSnout ? 22 : (cfg.longSnout ? 26 : 19);
  const snoutCy = cfg.longSnout ? 145 : 138;
  const s = cfg.scale || 1;
  return `
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="188" rx="52" ry="8" fill="rgba(43,58,74,0.10)"/>
    <g transform="translate(100 108) scale(${s}) translate(-100 -108)">
      ${ears(cfg)}
      <circle cx="100" cy="112" r="54" fill="${cfg.fur}"/>
      <ellipse cx="100" cy="${snoutCy}" rx="${snoutRx}" ry="${snoutRy}" fill="${cfg.snout}"/>
      ${pattern(cfg)}
      <circle cx="80" cy="${eyeY}" r="${eyeR}" fill="${cfg.eye}"/>
      <circle cx="120" cy="${eyeY}" r="${eyeR}" fill="${cfg.eye}"/>
      <circle cx="${cfg.bigEyes?77.5:78}" cy="${eyeY-2}" r="1.6" fill="#fff"/>
      <circle cx="${cfg.bigEyes?117.5:118}" cy="${eyeY-2}" r="1.6" fill="#fff"/>
      <ellipse cx="100" cy="${snoutCy-6}" rx="7" ry="5" fill="#2B2320"/>
      <path d="M92,${snoutCy+10} Q100,${snoutCy+16} 108,${snoutCy+10}" stroke="#2B2320" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
    <path d="M78,168 Q100,178 122,168 L122,178 Q100,186 78,178 Z" fill="${cfg.collar}"/>
    <circle cx="100" cy="180" r="4" fill="#FFD166"/>
  </svg>`;
}

/* =========================================================
   모드 2: 행동 해석 데이터
   같은 강아지 캐릭터의 자세/표정만 바꿔서 표현합니다.
========================================================= */
function baseDog(o){
  const legs = o.legs || `
    <rect x="88" y="130" width="15" height="36" rx="7" fill="${D.fur}"/>

/* =========================================================
   게임 상태 & 로직
========================================================= */
const TOTAL_ROUNDS = 10;
let state = { screen:'start', mode:'breed', round:0, score:0, order:[], current:null, choices:[], answered:false };
let lastCorrect = false;
let lastClickedKey = null;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function goHome(){ state.screen='start'; render(); }

function startGame(mode){
  state.mode = mode;
  state.screen='play';
  state.round=0;
  state.score=0;
  const pool = mode==='breed' ? DOGS : BEHAVIORS;
  state.order = shuffle(pool).slice(0, TOTAL_ROUNDS);
  nextRound();
}

function nextRound(){
  state.answered=false;
  const answer = state.order[state.round];
  state.current = answer;
  if(state.mode==='breed'){
    const others = shuffle(DOGS.filter(d=>d.key!==answer.key)).slice(0,3);
    state.choices = shuffle([answer, ...others]);
  } else {
    const opts = shuffle([{text:answer.correct, isCorrect:true}, ...answer.wrong.map(w=>({text:w, isCorrect:false}))]);
    state.choices = opts;
  }
  render();
}

function choose(key){
  if(state.answered) return;
  state.answered = true;
  lastClickedKey = key;
  lastCorrect = (key === state.current.key);
  if(lastCorrect) state.score++;
  render();
  setTimeout(()=>{ const nb = document.getElementById('nextBtn'); if(nb) nb.classList.add('show'); }, 350);
}

function chooseText(idx){
  if(state.answered) return;
  state.answered = true;
  const picked = state.choices[idx];
  lastCorrect = picked.isCorrect;
  lastClickedKey = idx;
  if(lastCorrect) state.score++;
  render();
  setTimeout(()=>{ const nb = document.getElementById('nextBtn'); if(nb) nb.classList.add('show'); }, 350);
}

function advance(){
  state.round++;
  if(state.round >= TOTAL_ROUNDS){ state.screen='end'; render(); }
  else nextRound();
}

function grade(score){
  if(score===10) return state.mode==='breed'
    ? {badge:'🏆 도그 마스터', desc:'완벽해요! 견종 감별사 자격 있어요.'}
    : {badge:'🏆 마음을 읽는 사람', desc:'강아지 속마음을 완벽히 이해했어요!'};
  if(score>=8) return {badge:'🐕 베스트 프렌드', desc:'강아지 지식이 상당하시네요!'};
  if(score>=5) return {badge:'🦴 산책 메이트', desc:'조금 더 알아가면 완벽하겠어요.'};
  return {badge:'🐾 입양 대기 중', desc:'다시 도전해서 마스터에 도전해봐요!'};
}

function pawRow(){
  let html = '<div class="paws">';
  for(let i=0;i<TOTAL_ROUNDS;i++){
    html += `<svg class="paw ${i<state.round?'on':''}" viewBox="0 0 24 24"><circle cx="12" cy="16" r="6" fill="#2B3A4A"/><circle cx="5" cy="8" r="2.6" fill="#2B3A4A"/><circle cx="10" cy="4" r="2.6" fill="#2B3A4A"/><circle cx="15" cy="4" r="2.6" fill="#2B3A4A"/><circle cx="19" cy="8" r="2.6" fill="#2B3A4A"/></svg>`;
  }
  html += '</div>';
  return html;
}

function render(){
  const app = document.getElementById('app');

  if(state.screen==='start'){
    const sample = shuffle(DOGS).slice(0,4);
    app.innerHTML = `
      <div class="card start-card">
        <div class="start-dogs">${sample.map(d=>dogSVG(d)).join('')}</div>
        <div class="mode-select">
          <div class="mode-btn" onclick="startGame('breed')">
            <span class="mode-emoji">🐩</span>견종 맞추기
            <span class="mode-sub">이름 보고 캐릭터 찾기</span>
          </div>
          <div class="mode-btn" onclick="startGame('behavior')">
            <span class="mode-emoji">💭</span>행동 해석
            <span class="mode-sub">행동 보고 마음 맞추기</span>
          </div>
        </div>
        <div class="start-desc">각 모드 ${TOTAL_ROUNDS}문제씩, 원하는 모드를 눌러 바로 시작해요.</div>
      </div>
      <div class="footer-note">실제 사진이 아닌 특징을 살린 캐릭터로 구성했어요 🐕</div>
    `;
    return;
  }

  if(state.screen==='end'){
    const g = grade(state.score);
    app.innerHTML = `
      <div class="card end-card">
        <div class="end-badge">${g.badge}</div>
        <div class="end-score">${state.score} / ${TOTAL_ROUNDS}</div>
        <div class="end-desc">${g.desc}</div>
        <div>
          <button class="restart-btn" onclick="startGame('${state.mode}')">다시 도전하기</button>
          <button class="restart-btn secondary" onclick="goHome()">모드 선택으로</button>
        </div>
      </div>
    `;
    return;
  }

  // play screen
  const isBreed = state.mode==='breed';
  const bodyHtml = isBreed ? `
      <div class="prompt-label">이 견종은?</div>
      <div class="prompt-name">${state.current.name}</div>
      <div class="grid" id="grid">
        ${state.choices.map(d => `
          <div class="choice" data-key="${d.key}" onclick="choose('${d.key}')">
            ${dogSVG(d)}
          </div>
        `).join('')}
      </div>
  ` : `
      <div class="prompt-label">이 행동은 무슨 뜻일까요?</div>
      <div class="behavior-scene">${state.current.svg}</div>
      <div class="behavior-caption">${state.current.caption}</div>
      <div class="choice-list" id="grid">
        ${state.choices.map((c,i) => `
          <div class="choice-text" data-idx="${i}" onclick="chooseText(${i})">${c.text}</div>
        `).join('')}
      </div>
  `;

  app.innerHTML = `
    <div class="hud">
      <span>${state.round+1} / ${TOTAL_ROUNDS} 문제</span>
      ${pawRow()}
      <span>점수 ${state.score}</span>
    </div>
    <div class="card">
      ${bodyHtml}
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="advance()">${state.round+1>=TOTAL_ROUNDS?'결과 보기':'다음 문제'}</button>
    </div>
  `;

  if(state.answered){
    if(isBreed){
      document.querySelectorAll('.choice').forEach(el=>{
        const k = el.getAttribute('data-key');
        el.classList.add('disabled');
        if(k === state.current.key) el.classList.add('correct');
        else if(k === lastClickedKey) el.classList.add('wrong');
      });
    } else {
      document.querySelectorAll('.choice-text').forEach(el=>{
        const i = Number(el.getAttribute('data-idx'));
        el.classList.add('disabled');
        if(state.choices[i].isCorrect) el.classList.add('correct');
        else if(i === lastClickedKey) el.classList.add('wrong');
      });
    }
    const fb = document.getElementById('feedback');
    fb.textContent = lastCorrect ? '정답이에요! 🎉' : (isBreed ? `아쉬워요! 정답은 ${state.current.name}` : '아쉬워요, 정답을 다시 확인해보세요');
    fb.className = 'feedback ' + (lastCorrect ? 'good' : 'bad');
  }
}

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
